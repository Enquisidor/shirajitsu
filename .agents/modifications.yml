    content: |
      ## Project-Specific Rules — Shirajitsu Backend

      These rules are derived from enforced conventions in this codebase and override or supplement the generic directives above.

      ### Service structure

      All domain logic lives in `internal/domain/`. HTTP handlers live in `internal/handlers/`. No business logic in handlers — validate the HTTP request, map it to a domain object, and delegate. A handler that contains conditional logic beyond request validation is a defect.

      Each service has its own `go.mod` at `services/<name>/go.mod`. Never share code across service Go modules — the Go module boundary is the service boundary.

      ### Logging

      Use `log/slog` with the JSON handler for all structured logging. Never use `fmt.Println`, `log.Printf`, or the `log` package directly. Every log call must include contextual key-value pairs (e.g. `"err"`, `"requestId"`, `"service"`).

      ### Service communication

      Services communicate over HTTP — not gRPC, not shared memory. Downstream service URLs come from environment variables with fallback defaults (see existing `env()` helper pattern). Every HTTP call to a downstream service must handle non-2xx responses and propagate a meaningful error upstream.

  - type: project_rule
    agents: [frontend]
    description: "Shared types, extension entrypoint isolation, and component library conventions"
    content: |
      ## Project-Specific Rules — Shirajitsu Frontend

      These rules are derived from enforced conventions in this codebase and override or supplement the generic directives above.

      ### Shared types

      All shared TypeScript types come from `@shirajitsu/types` (`workspace:*` dependency). Never locally redefine a type that already exists in the shared package — `Annotation`, `Claim`, `Source`, `AnalyzeRequest`, `AnalyzeResponse`, `AIModel`, and all related types are canonical in `@shirajitsu/types`. Import from there.

      ### Extension entrypoint isolation

      The Chrome extension has four separate entrypoints: `background`, `content`, `popup`, and `sidepanel`. Each is a separate JS bundle with no shared runtime. Communication between entrypoints must go through `chrome.runtime.onMessage` / `chrome.runtime.sendMessage`. Never use shared mutable state, global variables, or direct function imports across entrypoints.

      ### Component library

      Reusable React components live in `@shirajitsu/react` (`ui/components`). Before building a new component in the extension or web app, check whether it already exists there. Presentational components that could be reused across the extension and web app belong in `ui/components`, not duplicated per-app.
