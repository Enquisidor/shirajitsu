  extension-unguarded-tabmessage-fix:
    description: Audit all four extension source files for unguarded chrome.runtime.sendMessage / chrome.tabs.sendMessage calls; fix the unguarded SHOW_ANNOTATIONS chrome.tabs.sendMessage in Popup.tsx that was the persistent root cause of "Receiving end does not exist" after 0d22584
    status: complete
    started_at: "2026-05-11T16:15:00Z"
    completed_at: "2026-05-11T16:24:00Z"
    output: "ui/extension/src/popup/Popup.tsx"
    notes: |
      Root cause: chrome.tabs.sendMessage(tab.id!, { type: 'SHOW_ANNOTATIONS', ... }) at Popup.tsx line 96
      had NO callback. Chrome raises "Receiving end does not exist" when the content script is absent
      (chrome:// pages, PDF viewer, etc.) and no callback is provided to read chrome.runtime.lastError.

      Fix: introduced safeTabMessage() helper (analogous to safeBroadcast) that calls chrome.tabs.sendMessage
      with a callback that voids chrome.runtime.lastError. Replaced the unguarded call with safeTabMessage.

      All other sendMessage calls across all four files were already guarded:
        - Popup.tsx GET_CONTEXT: guarded (callback reads lastError)
        - Popup.tsx RUN_ANALYSIS: guarded (callback reads lastError, handles error)
        - Popup.tsx safeBroadcast: guarded
        - content/index.ts: callback form, reads lastError
        - background/index.ts: no sendMessage calls
        - Sidebar.tsx: no sendMessage calls

      Build: pnpm --filter @shirajitsu/extension build — PASS (tsc + vite, 0 errors)
      Tests: pnpm --filter @shirajitsu/extension test — 6/6 PASS
      Decision DEC-010 logged.

